version: '3.8'

services:
  nano-gallery:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: nano-gallery
    restart: unless-stopped
    user: "${PUID:-1001}:${PGID:-1001}"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      - NANO_STORAGE_DIR=/app/storage
      - NANO_DATA_DIR=/app/storage/data
      - NANO_UPLOADS_DIR=/app/storage/uploads
    volumes:
      # 运行时数据：Git 拉库/重建镜像不会覆盖这里
      - ${NANO_HOST_STORAGE_DIR:-./storage}/data:/app/storage/data
      - ${NANO_HOST_STORAGE_DIR:-./storage}/uploads:/app/storage/uploads
      - ${NANO_HOST_STORAGE_DIR:-./storage}/backups:/app/storage/backups
    networks:
      - nano-network

networks:
  nano-network:
    driver: bridge
